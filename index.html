<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cheap Data — Airtime & Data</title>
<style>
:root{--primary:#1769ff;--dark:#10213b;--bg:#f5f8ff;--white:#fff;--muted:#718096;--border:#dfe7f3}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--dark)}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:430px;background:#fff;border-radius:22px;padding:34px 28px;box-shadow:0 15px 45px rgba(16,33,59,.10)}
.logo{font-size:31px;font-weight:800;color:var(--primary);text-align:center;margin-bottom:7px}.tag{text-align:center;color:var(--muted);font-size:14px;margin-bottom:30px}
label{display:block;font-size:13px;font-weight:700;margin:17px 0 8px}.input{width:100%;height:52px;border:1px solid var(--border);border-radius:11px;padding:0 15px;font-size:15px;outline:none;background:#fbfdff}.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(23,105,255,.1)}
button{width:100%;height:52px;border:0;border-radius:11px;background:var(--primary);color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:22px}.secondary{background:#eef4ff;color:var(--primary)}
.link{text-align:center;color:var(--primary);font-size:14px;font-weight:700;margin-top:20px;cursor:pointer}.msg{font-size:13px;margin-top:12px;text-align:center;color:#d33;min-height:16px}
.dashboard{min-height:100vh}.topbar{background:#fff;border-bottom:1px solid var(--border);padding:17px 6%;display:flex;align-items:center;justify-content:space-between}.toplogo{font-weight:800;font-size:25px;color:var(--primary)}.logout{border:0;background:#eef4ff;color:var(--primary);padding:10px 15px;border-radius:9px;font-weight:700;cursor:pointer}
.main{max-width:1050px;margin:0 auto;padding:35px 20px}.welcome{margin-bottom:24px}.welcome h1{margin:0 0 7px;font-size:28px}.welcome p{margin:0;color:var(--muted)}.balance{background:linear-gradient(135deg,#1769ff,#124bc0);color:#fff;border-radius:20px;padding:25px;margin-bottom:24px}.balance small{opacity:.85}.balance strong{display:block;font-size:34px;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.tile{background:#fff;border:1px solid var(--border);border-radius:17px;padding:22px;cursor:pointer}.tile h3{margin:0 0 8px}.tile p{margin:0;color:var(--muted);font-size:13px}.notice{margin-top:22px;background:#fff;padding:18px;border-radius:15px;border:1px solid var(--border);color:#516173;font-size:14px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.topbar{padding:15px 20px}.main{padding:25px 16px}}
</style>
</head>
<body>

<div id="app"></div>

<script>
const app=document.getElementById("app");
let currentUser=JSON.parse(localStorage.getItem("cheapdata_current_user")||"null");

function loginPage(){
app.innerHTML=`<div class="screen"><div class="card">
<div class="logo">Cheap Data</div><div class="tag">Airtime & digital services</div>
<form id="loginForm">
<label>Username</label><input id="loginUser" class="input" autocomplete="username" required>
<label>Password</label><input id="loginPass" type="password" class="input" autocomplete="current-password" required>
<button type="submit">Login</button>
<div class="msg" id="loginMsg"></div>
</form>
<div class="link" onclick="registerPage()">Create Account</div>
</div></div>`;
document.getElementById("loginForm").onsubmit=e=>{
e.preventDefault();
const username=document.getElementById("loginUser").value.trim();
const password=document.getElementById("loginPass").value;
const users=JSON.parse(localStorage.getItem("cheapdata_users")||"[]");
const found=users.find(u=>u.username===username && u.password===password);
if(!found){document.getElementById("loginMsg").textContent="Username or password is incorrect.";return}
currentUser=found;localStorage.setItem("cheapdata_current_user",JSON.stringify(found));dashboard();
};
}

function registerPage(){
app.innerHTML=`<div class="screen"><div class="card">
<div class="logo">Cheap Data</div><div class="tag">Create your account</div>
<form id="registerForm">
<label>Username</label><input id="regUser" class="input" required>
<label>Password</label><input id="regPass" type="password" class="input" minlength="4" required>
<label>Phone Number</label><input id="regPhone" class="input" type="tel" required>
<label>Email Address</label><input id="regEmail" class="input" type="email" required>
<button type="submit">Create Account</button>
<div class="msg" id="regMsg"></div>
</form>
<div class="link" onclick="loginPage()">Already have an account? Login</div>
</div></div>`;
document.getElementById("registerForm").onsubmit=e=>{
e.preventDefault();
const user={username:document.getElementById("regUser").value.trim(),password:document.getElementById("regPass").value,phone:document.getElementById("regPhone").value.trim(),email:document.getElementById("regEmail").value.trim()};
let users=JSON.parse(localStorage.getItem("cheapdata_users")||"[]");
if(users.some(u=>u.username===user.username)){document.getElementById("regMsg").textContent="That username is already in use.";return}
users.push(user);localStorage.setItem("cheapdata_users",JSON.stringify(users));
currentUser=user;localStorage.setItem("cheapdata_current_user",JSON.stringify(user));dashboard();
};
}


function dataPage(){
app.innerHTML=`<div class="screen"><div class="card">
<div class="logo">Cheap Data</div><div class="tag">Buy mobile data</div>
<form id="dataForm">
<label>Mobile Number</label><input id="dataPhone" class="input" type="tel" inputmode="numeric" maxlength="11" placeholder="08012345678" required>
<label>Network</label><select id="dataNetwork" class="input" required><option value="">Select network</option><option>MTN</option><option>Glo</option><option>Airtel</option></select>
<label>Data Plan</label><select id="dataPlan" class="input" required><option value="">Select a plan</option><option value="100|250MB">₦100 — 250 MB</option><option value="200|500MB">₦200 — 500 MB</option><option value="300|700MB">₦300 — 700 MB</option></select>
<button type="submit">Continue</button><div class="msg" id="dataMsg"></div></form>
<button class="secondary" onclick="dashboard()">Back to Dashboard</button>
<div style="font-size:12px;color:#718096;text-align:center;margin-top:15px">Data delivery requires connection to an authorized VTU/data provider.</div>
</div></div>`;
document.getElementById("dataForm").onsubmit=e=>{e.preventDefault();const phone=document.getElementById("dataPhone").value.trim(),network=document.getElementById("dataNetwork").value,plan=document.getElementById("dataPlan").value.split("|");const msg=document.getElementById("dataMsg");if(!/^0\d{10}$/.test(phone)){msg.textContent="Enter a valid 11-digit Nigerian mobile number.";return}msg.style.color="#1769ff";msg.textContent=`Order ready: ${network} ${plan[1]} for ₦${plan[0]} to ${phone}.`;};
}

function depositPage(){
app.innerHTML=`<div class="screen"><div class="card">
<div class="logo">Cheap Data</div><div class="tag">Fund your account</div>
<div style="background:#f6f9ff;border:1px solid #dfe7f3;border-radius:14px;padding:18px;margin-bottom:20px">
  <div style="font-size:12px;color:#718096;margin-bottom:6px">Deposit account</div>
  <div style="font-weight:800;font-size:20px;letter-spacing:1px">9033470742</div>
  <div style="margin-top:12px;font-size:13px"><b>Bank:</b> OPay Finance Bank</div>
  <div style="margin-top:6px;font-size:13px"><b>Admin bank user:</b> David Samuel Itam</div>
</div>
<form id="depositForm">
<label>Amount to Deposit (₦)</label>
<input id="depositAmount" class="input" type="number" min="1" required>
<label>Payment Reference</label>
<input id="depositRef" class="input" placeholder="Enter your transfer reference" required>
<button type="submit">Submit Deposit</button>
<div class="msg" id="depositMsg"></div>
</form>
<button class="secondary" onclick="dashboard()">Back to Dashboard</button>
<div style="font-size:12px;color:#718096;text-align:center;margin-top:15px">
Deposits are subject to verification. Your dashboard balance should only be updated after a genuine payment has been verified.
</div>
</div></div>`;
document.getElementById("depositForm").onsubmit=e=>{
e.preventDefault();
const amount=Number(document.getElementById("depositAmount").value);
const ref=document.getElementById("depositRef").value.trim();
const deposits=JSON.parse(localStorage.getItem("cheapdata_deposits")||"[]");
deposits.push({username:currentUser.username,amount,reference:ref,status:"Pending verification",createdAt:new Date().toISOString()});
localStorage.setItem("cheapdata_deposits",JSON.stringify(deposits));
document.getElementById("depositMsg").style.color="#1769ff";
document.getElementById("depositMsg").textContent="Deposit submitted for verification.";
};
}

function dashboard(){
if(!currentUser){loginPage();return}
app.innerHTML=`<div class="dashboard">
<div class="topbar"><div class="toplogo">Cheap Data</div><button class="logout" onclick="logout()">Logout</button></div>
<main class="main">
<div class="welcome"><h1>Welcome, ${escapeHtml(currentUser.username)} 👋</h1><p>Manage your airtime and digital services from your dashboard.</p></div>
<div class="balance"><small>Wallet Balance</small><strong>₦0.00</strong><small>Demo dashboard — connect a secure payment/backend system before accepting real money.</small></div>
<div class="grid">
<div class="tile"><h3>📱 Buy Airtime</h3><p>Recharge a mobile number.</p></div>
<div class="tile" onclick="dataPage()"><h3>🌐 Buy Data</h3><p>Choose a network, number and data plan.</p></div>
<div class="tile"><h3>🧾 Transactions</h3><p>View your transaction history.</p></div><div class="tile" onclick="depositPage()"><h3>💰 Deposit</h3><p>View deposit details and submit a transfer for verification.</p></div>
</div>
<div class="notice"><b>Cheap Data</b><br>Welcome to your account. Use the Deposit section to submit a transfer for verification. A secure backend should verify payments before crediting the wallet.</div>
</main></div>`;
}
function logout(){localStorage.removeItem("cheapdata_current_user");currentUser=null;loginPage()}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
currentUser?dashboard():loginPage();
</script>
</body>
</html>
